# Meta4MPCXXL for MPC OS -- page layout (mpc-vst-plugins layout.conf syntax: tools/shadow_skin.py, docs/SKIN_STUDIO.md).
# Coordinates are Force Shadow pixels: the plugin area is x 0..1280, y 86..714 (skin y = shadow y - 86).
#
# Look: a black panel, white lines, coloured knobs in the Davies 1900H top-view shape (tools/knob_art.py draws them),
# one fixed colour per Q-Link slot, so knob 3 is always yellow. The knob colour is picked by the knob's RADIUS:
#   r=58 red, 57 orange, 56 yellow, 55 green, 54 blue, 53 purple, 52 pink, 51 light grey (Q-Links 1-8),
#   r=50 white (SETUP page).
# The plugin name is drawn into every page in Saira Stencil One (tools/post_skin.py); all live text is MPC's own font,
# large: label_scale makes knob names and values about 36 px, all pure white.
# Q-Links: page PATCH has the 8 knobs on the Force's first knob bank (reading order) and PAGE on Q-Link 9.
scale_names=1
label_scale=1.7
theme_bg=0e0e0e
theme_panel=0e0e0e
theme_line=3a3a3a
theme_ink=ffffff
theme_ink_dim=ffffff
theme_ink_faint=ffffff
theme_accent=3a3a3a
theme_accent_hi=ffffff
theme_knob_face=1c1c1c
theme_knob_ring=3a3a3a
theme_knob_dot=ffffff
theme_bar=0e0e0e
theme_seg_active=ffffff
theme_seg_inactive=1c1c1c
theme_seg_active_tx=111111
theme_btn_text=ffffff
theme_tab_on=ffffff
theme_tab_on_tx=111111
theme_lcd=1c1c1c
theme_box=1c1c1c
theme_tile_on=ffffff
qlinks_track = k1,k2,k3,k4,k5,k6,k7,k8,page

# ================================================================================================= PATCH
[tab PATCH]
# the patch: its name between arrows
stepper cx=770 cy=138 w=600 h=64 label="" key=patch prev=patch_prev next=patch_next get=patch_name tsize=34 tweight=700
# pages: five tabs around the current one, and the page number with arrows
list x=16 y=180 w=1010 h=52 cols=5 rows=1 th=52 gap=8 key=tab tsize=26 tweight=700 talign=center
stepper cx=1150 cy=206 w=230 h=52 label="" key=page prev=page_prev next=page_next get=page_pos tsize=28 tweight=700
readout cx=640 cy=256 w=1248 h=38 label="" key=status tsize=26 tweight=700
# the eight knobs of the current page
knob cx=160 cy=338 r=58 label="K1" key=k1
knob cx=480 cy=338 r=57 label="K2" key=k2
knob cx=800 cy=338 r=56 label="K3" key=k3
knob cx=1120 cy=338 r=55 label="K4" key=k4
knob cx=160 cy=554 r=54 label="K5" key=k5
knob cx=480 cy=554 r=53 label="K6" key=k6
knob cx=800 cy=554 r=52 label="K7" key=k7
knob cx=1120 cy=554 r=51 label="K8" key=k8
qlinks "PATCH" = k1,k2,k3,k4,k5,k6,k7,k8,page

# ================================================================================================= SETUP
# Static words on this page (the two group names, the help lines) and the option/button captions are drawn by
# tools/post_skin.py in Titillium Web at a large size; the layout leaves those labels empty.
[tab SETUP]
stepper cx=770 cy=138 w=600 h=64 label="" key=patch prev=patch_prev next=patch_next get=patch_name tsize=34 tweight=700
knob cx=160 cy=262 r=50 label="LEVEL" key=level
enum_h cx=640 cy=268 label="" key=cv_mode sw=210 sh=60
knob cx=1120 cy=262 r=50 label="CV CHANNEL" key=cv_chan
enum_h cx=640 cy=384 label="" key=midi_ins sw=210 sh=60
enum_h cx=250 cy=500 label="" key=wifi sw=150 sh=60
readout cx=820 cy=484 w=840 h=60 label="" key=wifi_addr tsize=34 tweight=700
readout cx=820 cy=542 w=840 h=44 label="" key=wifi_msg tsize=28 tweight=700
button cx=150 cy=652 label="RESCAN" key=rescan w=220 h=70
button cx=400 cy=652 label="PANIC" key=panic w=220 h=70 color=d23a2a
qlinks "SETUP" = level,cv_chan
